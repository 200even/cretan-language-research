name: source-consistent-v05

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-source-mask-v05.mjs'
      - 'scripts/augment-multitable-boundaries-v05.mjs'
      - 'scripts/rank-affixes-v05.mjs'
      - 'scripts/evaluate-v05-regression.mjs'
      - 'data/v05-source-overrides.csv'
      - 'data/v05-regression-set.csv'
      - 'data/v04-lexical-warnings.csv'
      - 'data/morphology-benchmark.csv'
      - 'experiments/source-consistent-v05.md'
      - '.github/workflows/source-consistent-v05.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-consistent-morphology:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4

      - name: Check out pinned Linear A Explorer corpus
        shell: bash
        run: |
          git clone --quiet https://github.com/mwenge/lineara.xyz.git upstream-lineara
          git -C upstream-lineara checkout --quiet 43fe7cf1abc8e6bb1ea3228c3a1bd5938709620a
          git -C upstream-lineara rev-parse HEAD

      - name: Build v0.5 source-consistency mask
        run: |
          mkdir -p replication-output-v0.5
          node scripts/build-source-mask-v05.mjs \
            --commentary-dir upstream-lineara/commentary \
            --source-overrides data/v05-source-overrides.csv \
            --out replication-output-v0.5/source-mask.csv
          node scripts/augment-multitable-boundaries-v05.mjs \
            --commentary-dir upstream-lineara/commentary \
            --mask replication-output-v0.5/source-mask.csv \
            --out replication-output-v0.5/source-mask.csv

      - name: Run v0.5 rankings with unchanged v0.4 scoring
        run: |
          node scripts/rank-affixes-v05.mjs \
            --corpus upstream-lineara/LinearAInscriptions.js \
            --structural-mask replication-output-v0.5/source-mask.csv \
            --lexical-warnings data/v04-lexical-warnings.csv \
            --out-dir replication-output-v0.5

      - name: Evaluate frozen v0.5 regression set
        id: regression
        continue-on-error: true
        run: |
          node scripts/evaluate-v05-regression.mjs \
            --benchmark data/morphology-benchmark.csv \
            --regression data/v05-regression-set.csv \
            --pairs replication-output-v0.5/exact-pairs.csv \
            --out-dir replication-output-v0.5

      - name: Record provenance
        if: always()
        shell: bash
        run: |
          {
            echo '# v0.5 provenance'
            echo
            echo '- research repo commit: `'"${GITHUB_SHA}"'`'
            echo '- upstream corpus: `mwenge/lineara.xyz`'
            echo '- upstream commit: `43fe7cf1abc8e6bb1ea3228c3a1bd5938709620a`'
            echo '- source mask: commentary/transcription tables with combined-ID reconciliation, multi-table boundary scanning, and segmented-fragment detection'
            echo '- source overrides: `data/v05-source-overrides.csv`'
            echo '- lexical warnings: frozen `data/v04-lexical-warnings.csv` (annotation only)'
            echo '- scoring: unchanged `scripts/rank-affixes-v04.mjs`, invoked by v0.5 wrapper'
            echo '- node: `'"$(node --version)"'`'
            echo '- run: `'"${GITHUB_RUN_ID}"'`'
            echo '- regression step outcome: `'"${{ steps.regression.outcome }}"'`'
          } > replication-output-v0.5/PROVENANCE.md

      - name: Persist v0.5 result in repository
        if: always()
        shell: bash
        run: |
          rm -rf results/source-consistent-v0.5
          mkdir -p results/source-consistent-v0.5
          cp -a replication-output-v0.5/. results/source-consistent-v0.5/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/source-consistent-v0.5
          if git diff --cached --quiet; then
            echo 'No generated result changes to commit.'
          else
            git commit -m 'Record source-consistent v0.5 morphology results'
            git push origin HEAD:main
          fi

      - name: Upload v0.5 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-consistent-morphology-v0.5
          path: replication-output-v0.5/
          if-no-files-found: error

      - name: Enforce regression result
        if: steps.regression.outcome == 'failure'
        run: exit 1
