name: apply-ja-audit-adjudications

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-ja-audit-adjudications.mjs'
      - '.github/workflows/apply-ja-audit-adjudications.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/apply-ja-audit-adjudications.mjs
      - name: Commit benchmark changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/morphology-benchmark.csv data/morphology-audit-queue.csv
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Apply final JA audit adjudications'
            git push origin HEAD:main
          fi
