name: statistical-calibration-v01

on:
  push:
    branches: [main]
    paths:
      - 'experiments/statistical-calibration-v01.md'
      - 'scripts/statistical-calibration-v01.mjs'
      - '.github/workflows/statistical-calibration-v01.yml'
      - 'data/v06-form-exclusions.csv'
      - 'results/source-consistent-v0.5/secure-word-occurrences.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run frozen calibration
        run: node scripts/statistical-calibration-v01.mjs
      - name: Commit generated results
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/statistical-calibration-v0.1
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Record statistical calibration v0.1'
            git push origin HEAD:main
          fi
