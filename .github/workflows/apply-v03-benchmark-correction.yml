name: apply-v03-benchmark-correction

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-v03-benchmark-correction.mjs'
      - '.github/workflows/apply-v03-benchmark-correction.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply correction
        run: node scripts/apply-v03-benchmark-correction.mjs
      - name: Commit correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/morphology-benchmark.csv data/morphology-audit-queue.csv
          if git diff --cached --quiet; then
            echo 'No correction needed.'
          else
            git commit -m 'Correct KU-NI morphology benchmark adjudication'
            git push origin HEAD:main
          fi
