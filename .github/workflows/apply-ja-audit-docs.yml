name: apply-ja-audit-docs

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-ja-audit-docs.mjs'
      - '.github/workflows/apply-ja-audit-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/apply-ja-audit-docs.mjs
      - name: Commit documentation updates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md METHODOLOGY.md REJECTED_HYPOTHESES.md experiments/damage-aware-v03.md
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Record final JA audit across project docs'
            git push origin HEAD:main
          fi
