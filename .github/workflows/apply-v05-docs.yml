name: apply-v05-docs

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-v05-docs.mjs'
      - '.github/workflows/apply-v05-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/apply-v05-docs.mjs
      - name: Commit v0.5 documentation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md METHODOLOGY.md
          if git diff --cached --quiet; then
            echo 'No documentation changes needed.'
          else
            git commit -m 'Document completed source-consistent v0.5'
            git push origin HEAD:main
          fi
