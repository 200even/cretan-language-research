name: apply-mi-pa-sa-integration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-mi-pa-sa-integration.mjs'
      - '.github/workflows/apply-mi-pa-sa-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply completed audit integration
        run: node scripts/apply-mi-pa-sa-integration.mjs
      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md METHODOLOGY.md experiments/source-consistent-v05.md data/morphology-benchmark.csv data/morphology-audit-queue.csv
          if git diff --cached --quiet; then
            echo 'No integration changes.'
          else
            git commit -m 'Integrate MI PA SA audit and grid frontier'
            git push origin HEAD:main
          fi
