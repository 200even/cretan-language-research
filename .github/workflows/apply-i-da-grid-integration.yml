name: apply-i-da-grid-integration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-i-da-grid-integration.mjs'
      - '.github/workflows/apply-i-da-grid-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/apply-i-da-grid-integration.mjs
      - name: Commit benchmark integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/morphology-benchmark.csv data/morphology-audit-queue.csv
          if git diff --cached --quiet; then
            echo 'No integration changes.'
          else
            git commit -m 'Integrate I-DA multi-ending audit'
            git push origin HEAD:main
          fi
