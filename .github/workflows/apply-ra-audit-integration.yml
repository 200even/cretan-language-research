name: apply-ra-audit-integration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-ra-audit-integration.mjs'
      - '.github/workflows/apply-ra-audit-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/apply-ra-audit-integration.mjs
      - name: Commit RA audit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/morphology-benchmark.csv README.md METHODOLOGY.md
          if git diff --cached --quiet; then
            echo 'No integration changes needed.'
          else
            git commit -m 'Integrate completed RA audit'
            git push origin HEAD:main
          fi
