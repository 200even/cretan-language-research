name: sibling-ending-grid-v02

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-sibling-ending-grid-v02.mjs'
      - 'results/source-consistent-v0.5/secure-word-occurrences.csv'
      - 'data/morphology-benchmark.csv'
      - 'data/v06-form-exclusions.csv'
      - 'experiments/sibling-ending-grid-v02.md'
      - '.github/workflows/sibling-ending-grid-v02.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-grid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sibling-ending grid
        run: |
          node scripts/build-sibling-ending-grid-v02.mjs \
            --occurrences results/source-consistent-v0.5/secure-word-occurrences.csv \
            --benchmark data/morphology-benchmark.csv \
            --form-exclusions data/v06-form-exclusions.csv \
            --out-dir results/sibling-ending-grid-v0.2
      - name: Persist generated grid
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/sibling-ending-grid-v0.2
          if git diff --cached --quiet; then
            echo 'No grid changes.'
          else
            git commit -m 'Record sibling-ending grid v0.2'
            git push origin HEAD:main
          fi
