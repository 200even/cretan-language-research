name: structural-aware-v04

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-structural-mask-v04.mjs'
      - 'scripts/rank-affixes-v04.mjs'
      - 'scripts/evaluate-v04-regression.mjs'
      - 'data/v04-source-overrides.csv'
      - 'data/v04-lexical-warnings.csv'
      - 'data/v04-regression-set.csv'
      - 'data/morphology-benchmark.csv'
      - 'experiments/structural-aware-v04.md'
      - '.github/workflows/structural-aware-v04.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  structural-aware-morphology:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4

      - name: Check out pinned Linear A Explorer corpus
        shell: bash
        run: |
          git clone --quiet https://github.com/mwenge/lineara.xyz.git upstream-lineara
          git -C upstream-lineara checkout --quiet 43fe7cf1abc8e6bb1ea3228c3a1bd5938709620a
          git -C upstream-lineara rev-parse HEAD

      - name: Build structural/type mask
        run: |
          mkdir -p replication-output-v0.4
          node scripts/build-structural-mask-v04.mjs \
            --commentary-dir upstream-lineara/commentary \
            --source-overrides data/v04-source-overrides.csv \
            --out replication-output-v0.4/structural-mask.csv

      - name: Run structural-aware v0.4 rankings
        run: |
          node scripts/rank-affixes-v04.mjs \
            --corpus upstream-lineara/LinearAInscriptions.js \
            --structural-mask replication-output-v0.4/structural-mask.csv \
            --lexical-warnings data/v04-lexical-warnings.csv \
            --out-dir replication-output-v0.4

      - name: Evaluate frozen v0.4 regression set
        id: regression
        continue-on-error: true
        run: |
          node scripts/evaluate-v04-regression.mjs \
            --benchmark data/morphology-benchmark.csv \
            --regression data/v04-regression-set.csv \
            --pairs replication-output-v0.4/exact-pairs.csv \
            --out-dir replication-output-v0.4

      - name: Record provenance
        if: always()
        shell: bash
        run: |
          {
            echo '# v0.4 provenance'
            echo
            echo '- research repo commit: `'"${GITHUB_SHA}"'`'
            echo '- upstream corpus: `mwenge/lineara.xyz`'
            echo '- upstream commit: `43fe7cf1abc8e6bb1ea3228c3a1bd5938709620a`'
            echo '- structural sources: upstream GORILA-derived commentary/transcription tables'
            echo '- source overrides: `data/v04-source-overrides.csv`'
            echo '- lexical warnings: `data/v04-lexical-warnings.csv` (annotation only)'
            echo '- node: `'"$(node --version)"'`'
            echo '- run: `'"${GITHUB_RUN_ID}"'`'
            echo '- regression step outcome: `'"${{ steps.regression.outcome }}"'`'
          } > replication-output-v0.4/PROVENANCE.md

      - name: Persist v0.4 result in repository
        if: always()
        shell: bash
        run: |
          rm -rf results/structural-aware-v0.4
          mkdir -p results/structural-aware-v0.4
          cp -a replication-output-v0.4/. results/structural-aware-v0.4/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/structural-aware-v0.4
          if git diff --cached --quiet; then
            echo 'No generated result changes to commit.'
          else
            git commit -m 'Record structural-aware v0.4 morphology results'
            git push origin HEAD:main
          fi

      - name: Upload v0.4 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-aware-morphology-v0.4
          path: replication-output-v0.4/
          if-no-files-found: error

      - name: Enforce regression result
        if: steps.regression.outcome == 'failure'
        run: exit 1
