name: apply-ne-audit-results

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-ne-audit-results.mjs'
      - '.github/workflows/apply-ne-audit-results.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/apply-ne-audit-results.mjs
      - name: Commit research updates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data/morphology-benchmark.csv data/morphology-audit-queue.csv
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Integrate NE audit results'
            git push origin HEAD:main
          fi
